<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Form</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <img src="logo.png" alt="Company logo" class="logo">
  <h1>Order form</h1>
  <p class="sub">Choose your products and quantities, then send your order.</p>
  <a class="info-sheet" href="RoottPDF.pdf" target="_blank" rel="noopener">
    <span class="info-sheet-title">Need more information?</span>
    <span class="info-sheet-action">Digital libraries, healing abutments, lab components &amp; Ti-bases</span>
  </a>

  <form id="orderForm">
    <label for="doctor">Doctor / practice name</label>
    <input id="doctor" name="doctor" required>

    <label for="contact">Phone or email</label>
    <input id="contact" name="contact" required>

    <label for="province">Province</label>
    <select id="province" name="province" required>
      <option value="">Select a province</option>
      <option>Eastern Cape</option>
      <option>Free State</option>
      <option>Gauteng</option>
      <option>KwaZulu-Natal</option>
      <option>Limpopo</option>
      <option>Mpumalanga</option>
      <option>North West</option>
      <option>Northern Cape</option>
      <option>Western Cape</option>
    </select>
    <div id="shipNote" role="status"></div>

    <div id="courierBox" hidden>
      <h2>Courier delivery details</h2>
      <label for="courierName">Name of person receiving the parcel</label>
      <input id="courierName" name="courierName">

      <label for="courierCell">Cell number</label>
      <input id="courierCell" name="courierCell" type="tel">

      <label for="courierAddress">Delivery address</label>
      <textarea id="courierAddress" name="courierAddress" rows="3"></textarea>
    </div>

    <label>Products</label>
    <div id="lines"></div>
    <button type="button" class="ghost" id="addLine">+ Add another product</button>

    <!-- NEW: running total -->
    <div id="summary" class="summary">
      <div class="sum-row"><span>Subtotal</span><span id="subtotal">R0.00</span></div>
      <div class="sum-row"><span>Shipping</span><span id="shipping">R0.00</span></div>
      <div class="sum-row total"><span>Total</span><span id="total">R0.00</span></div>
    </div>

    <label for="note">Patient name / note (optional)</label>
    <textarea id="note" name="note" rows="3"></textarea>

    <!-- NEW: optional copy of the order -->
    <label for="copyEmail">Your email (optional)</label>
    <input id="copyEmail" name="copyEmail" type="email" placeholder="you@example.com">
    <label class="check" id="copyWrap" hidden>
      <input type="checkbox" id="sendCopy" name="sendCopy">
      Send me a copy of this order
    </label>

    <button type="submit" class="primary">Send order</button>
    <div id="status" role="status"></div>
  </form>

  <!-- NEW: quote shown after the order is sent -->
  <section id="quote" hidden>
    <img src="logo.png" alt="Company logo" class="logo">
    <h2>Your quote</h2>
    <p id="quoteHint" class="ok"></p>
    <p id="quoteMeta"></p>
    <table id="quoteTable">
      <thead>
        <tr><th>Product</th><th>Qty</th><th>Price</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="quoteTotals"></div>
    <div class="quote-actions">
      <button type="button" class="primary" id="downloadQuote">Download / print quote</button>
      <button type="button" class="ghost" id="emailQuote">Email this to myself</button>
      <button type="button" class="ghost" id="newOrder">Place a new order</button>
    </div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
